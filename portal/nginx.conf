server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # El portal y la API son contenedores distintos. nginx hace de proxy para que
  # el navegador hable con un solo origen: sin CORS que configurar ni depurar.
  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
